<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pill-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.2)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.1)" />
    </linearGradient>
    <linearGradient id="pill-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.2)" />
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.1)" />
    </linearGradient>
    <linearGradient id="pill-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(52, 211, 153, 0.2)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.1)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Filter for glow effects -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Deep Slate Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Background Subtle Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS -->
  <!-- Floating Glowing Orbs -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.15" filter="url(#blur-glow)">
    <animate attributeName="cy" values="100;130;100" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="6s" repeatCount="indefinite" />
  </circle>

  <circle cx="1020" cy="300" r="160" fill="#a855f7" opacity="0.16" filter="url(#blur-glow)">
    <animate attributeName="cy" values="300;260;300" dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.14;0.25;0.14" dur="7s" repeatCount="indefinite" />
  </circle>

  <circle cx="600" cy="380" r="120" fill="#6366f1" opacity="0.12" filter="url(#blur-glow)">
    <animate attributeName="cx" values="600;640;600" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Network / Flow Lines in the background -->
  <g stroke-linecap="round" opacity="0.3">
    <!-- Curved flow line 1 -->
    <path d="M 100 340 Q 350 280 600 350 T 1100 290" fill="none" stroke="url(#primary-glow)" stroke-width="2" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="0;120" dur="12s" repeatCount="indefinite" />
    </path>
    <!-- Curved flow line 2 -->
    <path d="M 80 80 Q 400 140 750 70 T 1120 110" fill="none" stroke="url(#primary-glow)" stroke-width="1.5" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="14s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Pulsing Orbit Nodes -->
  <circle cx="180" cy="320" r="5" fill="#38bdf8">
    <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="1040" cy="120" r="6" fill="#c084fc">
    <animate attributeName="r" values="5;9;5" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="980" cy="340" r="4" fill="#34d399">
    <animate attributeName="r" values="3;7;3" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- FOREGROUND CONTENT: Guaranteed pristine visibility & high contrast -->
  <g transform="translate(0, 0)">
    <!-- Top Pill Tag -->
    <g transform="translate(435, 48)">
      <rect width="330" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
      <circle cx="20" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="21" fill="#e2e8f0" class="badge-text" letter-spacing="0.5">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title (Gradated Foreground) -->
    <text x="600" y="145" text-anchor="middle" class="title-text" font-size="44" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))">
      Employee Self-Service &amp; Helpdesk
    </text>

    <!-- Gradient Accent Sub-Title Bar -->
    <text x="600" y="195" text-anchor="middle" class="title-text" font-size="28" fill="url(#primary-glow)">
      Enterprise Service Management &amp; Open-Source HR Portals
    </text>

    <!-- Descriptive Subtitle -->
    <text x="600" y="240" text-anchor="middle" class="subtitle-text" font-size="16" fill="#94a3b8">
      A comprehensive landscape of SaaS leaders and self-hosted ITSM / HR service delivery platforms
    </text>

    <!-- Interactive / Status Pills in Foreground -->
    <g transform="translate(195, 290)">
      <!-- Pill 1: SaaS ESM -->
      <g transform="translate(0, 0)">
        <rect width="250" height="52" rx="12" fill="url(#pill-grad-1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
        <text x="24" y="26" fill="#7dd3fc" class="badge-text">🏢 Enterprise SaaS ESM</text>
        <text x="24" y="42" fill="#94a3b8" font-size="11" font-family="sans-serif">ServiceNow • Workday • Freshservice</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g transform="translate(280, 0)">
        <rect width="250" height="52" rx="12" fill="url(#pill-grad-2)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" />
        <text x="24" y="26" fill="#d8b4fe" class="badge-text">⚡ Open-Source Platforms</text>
        <text x="24" y="42" fill="#94a3b8" font-size="11" font-family="sans-serif">Chatwoot • GLPI • Zammad • Horilla</text>
      </g>

      <!-- Pill 3: Self-Service & ITIL -->
      <g transform="translate(560, 0)">
        <rect width="250" height="52" rx="12" fill="url(#pill-grad-3)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.2" />
        <text x="24" y="26" fill="#6ee7b7" class="badge-text">🛡️ ITIL &amp; ESS Delivery</text>
        <text x="24" y="42" fill="#94a3b8" font-size="11" font-family="sans-serif">Ticketing • CMDB • HR Portals</text>
      </g>
    </g>

    <!-- Subtle bottom decorative line with animated glow shimmer -->
    <line x1="200" y1="385" x2="1000" y2="385" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <circle cx="600" cy="385" r="3" fill="#818cf8">
      <animate attributeName="cx" values="250;950;250" dur="8s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>